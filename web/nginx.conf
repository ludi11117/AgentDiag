# FlawScope 前端 nginx 配置。
#
# 承担两件事：
#   1. 托管 SPA 静态资源（含 history 路由回退）
#   2. 把 /api 反代到后端容器，并**针对 SSE 关闭缓冲**

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源：带 hash 的文件名可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 回退：前端路由的路径在磁盘上并不存在文件，
    # 不做这个回退，用户直接访问 /history 会拿到 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代
    location /api/ {
        # 末尾的 / 会剥掉 /api 前缀：/api/records -> /records，
        # 与 Vite 开发期的 rewrite 行为保持一致，
        # 这样前端代码在开发和生产两种环境下请求路径完全一样。
        proxy_pass http://flawscope:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ===== SSE 关键配置 =====
        # 默认情况下 nginx 会缓冲上游响应，攒够一个 buffer 才下发。
        # 对 /diagnose/stream 这种"每个节点推一条"的接口，缓冲会让前端的
        # 逐节点进度退化成"最后一次性全出来"，SSE 等于白做。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # 一次诊断要串行走 6~9 次 LLM 调用，实测可达数十秒；
        # 默认 60s 读超时会在中途掐断流式连接。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
