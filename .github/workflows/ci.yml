name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 建议把版本与本地对齐后固定（pip install ruff==x.y.z），避免 CI 规则集漂移
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Run ruff
        run: ruff check . --output-format=github

  test:
    name: Unit tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          SILICONFLOW_API_KEY: test-key-for-unit-tests
        run: pytest -q
